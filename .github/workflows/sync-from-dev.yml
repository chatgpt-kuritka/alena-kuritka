name: Publish static Lovable export to production

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-from-dev.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone static export from dev gh-pages
        run: |
          git clone --depth 1 --branch gh-pages https://github.com/chatgpt-kuritka/alena-kuritka-dev.git /tmp/alena-kuritka-static

      - name: Replace production contents with static export
        run: |
          rsync -a --delete \
            --exclude ".git/" \
            --exclude "CNAME" \
            --exclude ".github/workflows/sync-from-dev.yml" \
            /tmp/alena-kuritka-static/ ./
          printf "alena.kuritka.com" > CNAME

      - name: Commit production publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Publish static Lovable export to production"
            git push origin main
          fi
